<rect x="640" y="116" width="150" height="28" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="715" y="135" font-size="13" fill="#222" text-anchor="middle">USB stick</text>
<path d="M600 130 L640 130" fill="none" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
<text x="715" y="162" font-size="12" fill="#b00" text-anchor="middle">away from the ESP32's antenna</text>
<path d="M500 144 L500 196" fill="none" stroke="#555" stroke-width="4" stroke-linejoin="round"/>
<rect x="400" y="205" width="200" height="310" rx="12" fill="#2f6b3a" stroke="none" stroke-width="2"/>
