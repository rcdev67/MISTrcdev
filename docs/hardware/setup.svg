<text x="840" y="347" font-size="12.5" fill="#cfe0f0" text-anchor="middle">the WiFi modem, Zimodem</text>
<text x="840" y="364" font-size="12.5" fill="#cfe0f0" text-anchor="middle">N16R8; the 1U takes an</text>
<text x="840" y="381" font-size="12.5" fill="#cfe0f0" text-anchor="middle">external antenna</text>
<circle cx="720" cy="410" r="4" fill="#2b8a3e"/>
<text x="728" y="414" font-size="10.5" fill="#fff" text-anchor="start" font-weight="bold">GPIO16</text>
<circle cx="720" cy="428" r="4" fill="#2b8a3e"/>
<text x="728" y="432" font-size="10.5" fill="#fff" text-anchor="start" font-weight="bold">GPIO15</text>
<circle cx="720" cy="446" r="4" fill="#d62828"/>
<text x="728" y="450" font-size="10.5" fill="#fff" text-anchor="start" font-weight="bold">5V</text>
<circle cx="720" cy="462" r="4" fill="#222222"/>
<text x="728" y="466" font-size="10.5" fill="#fff" text-anchor="start" font-weight="bold">GND</text>
<path d="M720 410 L680 410 L680 297 L585 297" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linejoin="round"/>
<path d="M720 428 L660 428 L660 339 L585 339" fill="none" stroke="#2b8a3e" stroke-width="3" stroke-linejoin="round"/>
<text x="840" y="492" font-size="12" fill="#2b8a3e" text-anchor="middle">GPIO16 to pin 41, GPIO15 to pin 51,</text>
<text x="840" y="508" font-size="12" fill="#555" text-anchor="middle">see wiring.svg</text>
<path d="M290 455 L290 650 L700 650 L700 446 L720 446" fill="none" stroke="#d62828" stroke-width="3" stroke-linejoin="round"/>
<circle cx="290" cy="455" r="4.5" fill="#d62828"/>
<path d="M270 500 L270 662 L710 662 L710 462 L720 462" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
<circle cx="270" cy="500" r="4.5" fill="#222222"/>
<text x="500" y="642" font-size="12" fill="#444" text-anchor="middle">to the S3's 5V pin, never to its 3V3</text>
