<path d="M500 530 L500 560" fill="none" stroke="#555" stroke-width="4" stroke-linejoin="round"/>
<rect x="420" y="560" width="160" height="40" rx="8" fill="#fff" stroke="#666" stroke-width="2"/>
<text x="500" y="586" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">HDMI display</text>
<text x="500" y="695" font-size="13" fill="#b00" text-anchor="middle">Never two supplies for the Tang at once: no PC and no powered dock on its USB-C while the 5V pin is fed.</text>
