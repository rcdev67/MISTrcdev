<text x="488" y="330" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">Tang Nano 20K</text>
<text x="488" y="352" font-size="12.5" fill="#d8eadb" text-anchor="middle">GW2AR-18C</text>
<text x="488" y="370" font-size="12.5" fill="#d8eadb" text-anchor="middle">onboard BL616 =</text>
<text x="488" y="386" font-size="12.5" fill="#d8eadb" text-anchor="middle">the companion</text>
<rect x="404" y="430" width="40" height="26" rx="3" fill="#c0c8cf" stroke="#555" stroke-width="1"/>
<text x="424" y="447" font-size="10.5" fill="#333" text-anchor="middle">SD</text>
